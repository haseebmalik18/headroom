[project]
name = "hotpath"
version = "0.1.0"
description = "An autonomous performance engineer that investigates SLO violations, runs controlled experiments, and ships only verified fixes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click==8.1.8",
    "httpx==0.28.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "typer==0.15.1",
]

[project.scripts]
hotpath = "hotpath.cli:app"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hotpath"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
