# What HotPath should optimize in this repository, and how to run it.

service: checkout-service

objective:
  endpoint: POST /inventory/reserve
  metric: p99_ms
  target: 100          # p99 latency must be below this many milliseconds

constraints:
  tests: pass
  max_error_rate: 0.001
  max_memory_mb: 1024

workload:
  concurrency: 500     # concurrent shoppers
  think_ms: 2000       # mean pause between a shopper's requests
  warmup: 10s
  duration: 30s

runtime:
  compose_file: docker-compose.yml
  app_service: app
  app_port: 8000
  db_service: db
  tests_service: tests
  load_service: k6
  load_script: /load/reserve.js
  metrics_path: /metrics
  # A candidate fix may never modify these: they decide correctness and speed.
  protected_paths:
    - tests/*
    - load/*
    - scripts/*
    - hotpath.yaml
    - docker-compose.yml
    - Dockerfile
    - db/Dockerfile
    - db/network-entrypoint.sh
