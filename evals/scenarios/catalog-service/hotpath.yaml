# What HotPath should optimize in this repository, and how to run it.

service: catalog-service

objective:
  endpoint: GET /catalog/categories/{category_id}/products
  metric: p99_ms
  target: 50

constraints:
  tests: pass
  max_error_rate: 0.001
  max_memory_mb: 1024

workload:
  concurrency: 100
  think_ms: 1000
  warmup: 10s
  duration: 30s

runtime:
  compose_file: docker-compose.yml
  app_service: app
  app_port: 8000
  db_service: db
  tests_service: tests
  load_service: k6
  load_script: /load/browse.js
  metrics_path: /metrics
  protected_paths:
    - tests/*
    - load/*
    - hotpath.yaml
    - docker-compose.yml
    - Dockerfile
    - db/Dockerfile
    - db/network-entrypoint.sh
