# What Headroom should optimize in this repository, and how to run it.

service: pricing-service

# Shoppers check prices and place orders. Both have an SLO; prices are what is
# being investigated, and a fix must not push orders over theirs.
objectives:
  - endpoint: GET /products/{sku}/price
    metric: p99_ms
    target: 100
  - endpoint: POST /orders
    metric: p99_ms
    target: 150

constraints:
  tests: pass
  max_error_rate: 0.001
  max_memory_mb: 1024

workload:
  concurrency: 200
  think_ms: 200
  warmup: 10s
  duration: 30s

runtime:
  compose_file: docker-compose.yml
  app_service: app
  app_port: 8000
  db_service: db
  tests_service: tests
  load_service: k6
  load_script: /load/prices.js
  metrics_path: /metrics
  protected_paths:
    - tests/*
    - load/*
    - headroom.yaml
    - docker-compose.yml
    - Dockerfile
    - db/Dockerfile
    - db/network-entrypoint.sh
