services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
      # Network latency on database responses. The dashboard reads from a reporting
      # replica in another region, about 15 ms away (Docker's bridge is ~0.06 ms).
      DB_NETWORK_DELAY: ${DB_NETWORK_DELAY:-15ms}
    cap_add:
      - NET_ADMIN
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # TCP check: during first-time init Postgres only listens on its Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dashboard -d dashboard"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 180s

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: test
    environment:
      BASE_URL: http://app:8000
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
    volumes:
      - ${RESULTS_DIR:-./results}:/results
    depends_on:
      app:
        condition: service_healthy
    profiles: ["tools"]

  k6:
    image: grafana/k6:0.54.0
    environment:
      BASE_URL: http://app:8000
    volumes:
      - ./load:/load:ro
      - ${RESULTS_DIR:-./results}:/results
    depends_on:
      app:
        condition: service_healthy
    profiles: ["tools"]
